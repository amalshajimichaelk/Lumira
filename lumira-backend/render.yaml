services:
  - type: web
    name: lumira-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: lumira-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: https://lumira-frontend.onrender.com
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_DOMAIN
        value: .onrender.com

databases:
  - name: lumira-db
    plan: free
    databaseName: lumira
    user: lumira_user
