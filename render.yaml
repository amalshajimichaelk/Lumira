services:
  - type: web
    name: lumira-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: lumira-backend
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lumira-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: https://lumira-frontend.onrender.com
      - key: COOKIE_SECURE
        value: true

  - type: web
    name: lumira-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lumira-backend-epk6.onrender.com/api

databases:
  - name: lumira-db
    plan: free
    databaseName: lumira
    user: lumira_user
